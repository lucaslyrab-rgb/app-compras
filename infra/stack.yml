version: "3.9"

services:
  web:
    # Atualizada automaticamente pelo workflow somente após build e scans aprovados.
    image: ghcr.io/lucaslyrab-rgb/app-compras:sha-3b5822ff9c7c58737efdbf6fe058cf00c1c93e64
    networks:
      - externa
    secrets:
      - app_compras_database_url
      - app_compras_s3_photos_access_key_id
      - app_compras_s3_photos_secret_access_key
    environment:
      DATABASE_URL_FILE: /run/secrets/app_compras_database_url
      APP_URL: https://compras.muitomaisatacado.com
      NODE_ENV: production
      S3_PHOTOS_BUCKET: compras-img
      S3_PHOTOS_REGION: us-east-1
      S3_PHOTOS_ACCESS_KEY_ID_FILE: /run/secrets/app_compras_s3_photos_access_key_id
      S3_PHOTOS_SECRET_ACCESS_KEY_FILE: /run/secrets/app_compras_s3_photos_secret_access_key
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        reservations:
          cpus: "0.10"
          memory: 128M
        limits:
          cpus: "1.00"
          memory: 512M
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        monitor: 45s
      rollback_config:
        parallelism: 1
        order: stop-first
        monitor: 45s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - traefik.enable=true
        - traefik.docker.network=externa
        - traefik.http.routers.app-compras.rule=Host(`compras.muitomaisatacado.com`)
        - traefik.http.routers.app-compras.entrypoints=websecure
        - traefik.http.routers.app-compras.tls.certresolver=letsencryptresolver
        - traefik.http.services.app-compras.loadbalancer.server.port=3000
        - traefik.http.services.app-compras.loadbalancer.healthcheck.path=/api/health
        - traefik.http.services.app-compras.loadbalancer.healthcheck.interval=30s

networks:
  externa:
    external: true

secrets:
  app_compras_database_url:
    external: true
  app_compras_s3_photos_access_key_id:
    external: true
  app_compras_s3_photos_secret_access_key:
    external: true
