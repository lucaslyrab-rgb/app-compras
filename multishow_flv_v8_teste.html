<style>

.toolbar,.tabs,.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar select,.toolbar input,.filters input,.filters select{min-height:38px}

.danger{color:#a51d1d}.tabs{margin:14px 0}.tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin:12px 0}

.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;background:#fff;min-width:760px}

td.num,th.num{text-align:right}.changed td{background:var(--danger);color:var(--dangerInk)}.inactive{opacity:.55}

.notice{background:var(--warn);padding:10px 12px;border-radius:9px}.right{margin-left:auto}.hidden{display:none!important}.actions{display:flex;gap:7px;flex-wrap:wrap}

@media print{

const STORES = {

const fmt=n=>Number(n||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const money=n=>"R$ "+fmt(n);

function initialState(){
 return {products:structuredClone(BASE_PRODUCTS),drafts:{loja1:{},loja2:{},loja3:{}},orders:[],costHistory:{},shipments:{},purchased:{},invoices:{}};
}
let state=JSON.parse(localStorage.getItem(KEY)||"null")||initialState(); state.purchased??={}; state.invoices??={};
let role=localStorage.getItem(KEY+"_role")||"loja1", tab="";
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function activeProducts(){return state.products.filter(p=>p.active)}
function latestOrder(store,date=isoDate()){
 return state.orders.filter(o=>o.store===store&&o.date===date).sort((a,b)=>b.createdAt.localeCompare(a.createdAt))[0]||null;
}
function latestOrdersByStore(date=isoDate()){return Object.fromEntries(Object.keys(STORES).map(s=>[s,latestOrder(s,date)]))}
function itemFromOrder(order,code){return order?.items?.find(i=>i.code===code)||{stock:0,order:0}}
function latestCost(code){let a=(state.costHistory[code]||[]).slice().sort((x,y)=>y.at.localeCompare(x.at));return a[0]||null}
function previousCost(code){let a=(state.costHistory[code]||[]).slice().sort((x,y)=>y.at.localeCompare(x.at));return a[1]||null}
function recordCost(code,value){
 value=Number(value||0); let a=state.costHistory[code]||[];
 const today=isoDate(), existing=a.find(x=>x.date===today);
 if(existing){existing.value=value;existing.at=new Date().toISOString()} else a.push({date:today,value,at:new Date().toISOString()});

}

function init(){

 $("#todayLabel").textContent=new Date().toLocaleDateString("pt-BR");

function render(){
 const tabs=tabsFor(role); if(!tabs.some(x=>x[0]===tab))tab=tabs[0][0];
 $("#tabs").innerHTML=tabs.map(([k,n])=>`<button class="tab ${k===tab?"active":""}" onclick="tab='${k}';render()">${n}</button>`).join("");
 if(tab==="pedido")renderOrder();
 if(tab==="historico")renderStoreHistory();
 if(tab==="conferencia")renderConference();
 if(tab==="consolidado")renderConsolidated();
 if(tab==="custos")renderCosts();
 if(tab==="fornecedor")renderSupplierOrder();
 if(tab==="notas")renderInvoices();
 if(tab==="precificacao")renderPricing();
 if(tab==="produtos")renderProducts();

}
let orderFilter="all",orderSearch="";
function setOrderFilter(f){orderFilter=f;renderOrder()}
function setOrderSearch(v){orderSearch=v.toLowerCase();renderOrder()}
function clearStoreDraft(){if(confirm("Limpar os dados preenchidos?")){state.drafts[role]={};save();renderOrder()}}
function renderOrder(){
 let d=state.drafts[role]||{},all=activeProducts(),withN=all.filter(p=>Number(d[p.code]?.order||0)>0).length;
