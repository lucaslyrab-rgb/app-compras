name: Build, scan and deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: release-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:release-ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate
      - run: npm run db:import-products
      - run: npm run test:integration
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Scan repository for secrets
        shell: bash
        run: |
          set -euo pipefail
          secret_pattern='-----BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{40,}|AKIA[0-9A-Z]{16}|xox[baprs]-[0-9A-Za-z-]{20,}'
          if git grep -nI -E -e "$secret_pattern" -- . ':!package-lock.json'; then
            echo "Potential credential detected in tracked source" >&2
            exit 1
          fi

  image:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=long
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: app-compras:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image for HIGH/CRITICAL vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache" \
            aquasec/trivy@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 \
            image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL app-compras:scan
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: push
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
      - name: Promote immutable image in GitOps manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        run: |
          sed -i "s#image: ghcr.io/lucaslyrab-rgb/app-compras:sha-[^[:space:]]*#image: $IMAGE#" infra/stack.yml
          grep -F "image: $IMAGE" infra/stack.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/stack.yml
          git commit -m "chore(deploy): promote ${GITHUB_SHA} [skip ci]"
          git push origin HEAD:main
      - name: Trigger Portainer GitOps webhook
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          test -n "$PORTAINER_WEBHOOK_URL"
          curl --fail-with-body --silent --show-error --max-time 30 --retry 2 --request POST "$PORTAINER_WEBHOOK_URL"

  notify:
    name: Notify release by email
    if: always()
    needs: [verify, image]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Configure AWS credentials for SES
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
      - name: Send success or failure notification
        env:
          SES_FROM_EMAIL: ${{ secrets.SES_FROM_EMAIL || 'lucaslyrab@hotmail.com' }}
          SES_TO_EMAIL: ${{ secrets.SES_TO_EMAIL || 'lucaslyrab@hotmail.com' }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${AWS_ACCESS_KEY_ID:-}"
          test -n "${AWS_SECRET_ACCESS_KEY:-}"
          test -n "$SES_FROM_EMAIL"
          test -n "$SES_TO_EMAIL"

          if [[ "$VERIFY_RESULT" == "success" && "$IMAGE_RESULT" == "success" ]]; then
            status="SUCESSO"
            summary="Build, testes, scan, publicação GHCR, promoção do manifesto e webhook concluídos."
          else
            status="FALHA"
            summary="Uma etapa do release falhou ou foi ignorada; consulte os resultados abaixo."
          fi

          body="Release app-compras: $status

          $summary

          Commit: $COMMIT_SHA
          Branch: $REF_NAME
          Resultado verify: $VERIFY_RESULT
          Resultado image/deploy: $IMAGE_RESULT
          Workflow: $RUN_URL"

          jq -n \
            --arg from "$SES_FROM_EMAIL" \
            --arg to "$SES_TO_EMAIL" \
            --arg subject "[app-compras] Release $status — ${COMMIT_SHA:0:12}" \
            --arg body "$body" \
            '{Source:$from,Destination:{ToAddresses:[$to]},Message:{Subject:{Data:$subject,Charset:"UTF-8"},Body:{Text:{Data:$body,Charset:"UTF-8"}}}}' \
            > "$RUNNER_TEMP/ses-email.json"
          aws ses send-email --cli-input-json "file://$RUNNER_TEMP/ses-email.json"
