<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 880" width="420" height="880" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="headerGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#004737"/>
      <stop offset="100%" stop-color="#006b4f"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Moldura do Celular -->
  <rect x="15" y="15" width="390" height="850" rx="42" fill="#f8fafc" stroke="#334155" stroke-width="4"/>
  <rect x="145" y="22" width="130" height="26" rx="13" fill="#1e293b"/>

  <!-- Barra de Status Mobile -->
  <text x="42" y="40" font-size="13" font-weight="700" fill="#0f172a">09:42</text>
  <circle cx="340" cy="36" r="3" fill="#0f172a"/>
  <circle cx="348" cy="36" r="3" fill="#0f172a"/>
  <circle cx="356" cy="36" r="3" fill="#0f172a"/>
  <rect x="366" y="30" width="18" height="11" rx="3" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="368" y="32" width="12" height="7" rx="1.5" fill="#0f172a"/>

  <!-- Topbar Base -->
  <rect x="15" y="54" width="390" height="66" fill="url(#headerGrad2)"/>
  <rect x="28" y="70" width="34" height="34" rx="8" fill="rgba(255,255,255,0.2)"/>
  <text x="45" y="92" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">‹</text>
  <text x="72" y="84" font-size="15" font-weight="800" fill="#ffffff">Conferência de Entrega</text>
  <text x="72" y="102" font-size="11" font-weight="500" fill="#a7f3d0">Ponta da Fruta • Pedido #1084</text>

  <rect x="325" y="72" width="65" height="30" rx="8" fill="rgba(255,255,255,0.15)"/>
  <text x="357" y="91" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Menu ☰</text>

  <!-- Card Resumo de Progresso e Ciclo -->
  <g filter="url(#shadow2)">
    <rect x="28" y="128" width="364" height="74" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    
    <text x="42" y="148" font-size="11" font-weight="700" fill="#64748b" text-transform="uppercase">Ciclo 27/10 • Chegada Caminhão</text>
    <text x="376" y="148" font-size="12" font-weight="800" fill="#006b4f" text-anchor="end">75% Concluído</text>
    
    <text x="42" y="168" font-size="14" font-weight="800" fill="#0f172a">18 de 24 itens conferidos</text>
    <text x="210" y="168" font-size="12" font-weight="600" fill="#d97706">(6 pendentes de peso)</text>

    <!-- Barra de Progresso Verde -->
    <rect x="42" y="180" width="336" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="42" y="180" width="252" height="8" rx="4" fill="#10b981"/>
  </g>

  <!-- Filtros Rápidos Compactos -->
  <rect x="28" y="210" width="116" height="32" rx="8" fill="#e2e8f0"/>
  <text x="86" y="230" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">Todos (24)</text>

  <rect x="150" y="210" width="124" height="32" rx="8" fill="#006b4f"/>
  <text x="212" y="230" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">⏳ Pendentes (6)</text>

  <rect x="280" y="210" width="112" height="32" rx="8" fill="#e2e8f0"/>
  <text x="336" y="230" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">✓ Conferidos (18)</text>

  <!-- Barra de Busca -->
  <rect x="28" y="248" width="364" height="36" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="42" y="271" font-size="12" fill="#94a3b8">🔍 Buscar produto ou código ERP...</text>

  <!-- LISTA DE PRODUTOS COM MINIATURAS FOTOGRÁFICAS -->

  <!-- CARD 1: PENDENTE (TOMATE DÉBORA) -->
  <g filter="url(#shadow2)">
    <rect x="28" y="292" width="364" height="126" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="28" y="292" width="6" height="126" rx="3" fill="#f59e0b"/>

    <!-- FOTO DO PRODUTO (THUMBNAIL 48x48) -->
    <rect x="42" y="304" width="48" height="48" rx="10" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="66" y="335" font-size="26" text-anchor="middle">🍅</text>

    <!-- Dados do Produto -->
    <text x="98" y="318" font-size="11" font-weight="800" fill="#b45309">ERP 305</text>
    <rect x="306" y="304" width="76" height="18" rx="9" fill="#fef3c7"/>
    <text x="344" y="317" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">⏳ Pendente</text>

    <text x="98" y="335" font-size="14" font-weight="800" fill="#0f172a">Tomate Débora Extra</text>
    <text x="98" y="352" font-size="12" font-weight="600" fill="#64748b">Pedido: <tspan fill="#047857" font-weight="800">8 CX</tspan></text>

    <!-- Linha de Input de Peso e Botão Não Recebido -->
    <rect x="42" y="366" width="162" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="54" y="391" font-size="14" font-weight="700" fill="#94a3b8">Peso real...</text>
    <text x="190" y="391" font-size="12" font-weight="800" fill="#64748b" text-anchor="end">KG</text>

    <rect x="214" y="366" width="168" height="40" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="298" y="391" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">✕ Não Recebido (0 KG)</text>
  </g>

  <!-- CARD 2: PENDENTE (BATATA INGLESA) -->
  <g filter="url(#shadow2)">
    <rect x="28" y="426" width="364" height="126" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="28" y="426" width="6" height="126" rx="3" fill="#f59e0b"/>

    <!-- FOTO DO PRODUTO (THUMBNAIL 48x48) -->
    <rect x="42" y="438" width="48" height="48" rx="10" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
    <text x="66" y="469" font-size="26" text-anchor="middle">🥔</text>

    <text x="98" y="452" font-size="11" font-weight="800" fill="#b45309">ERP 412</text>
    <rect x="306" y="438" width="76" height="18" rx="9" fill="#fef3c7"/>
    <text x="344" y="451" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">⏳ Pendente</text>

    <text x="98" y="469" font-size="14" font-weight="800" fill="#0f172a">Batata Inglesa Lisa</text>
    <text x="98" y="486" font-size="12" font-weight="600" fill="#64748b">Pedido: <tspan fill="#047857" font-weight="800">5 SC</tspan></text>

    <rect x="42" y="500" width="162" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="54" y="525" font-size="14" font-weight="700" fill="#94a3b8">Peso real...</text>
    <text x="190" y="525" font-size="12" font-weight="800" fill="#64748b" text-anchor="end">KG</text>

    <rect x="214" y="500" width="168" height="40" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="298" y="525" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">✕ Não Recebido (0 KG)</text>
  </g>

  <!-- CARD 3: JÁ CONFERIDO RECEBIDO (BANANA PRATA) -->
  <g filter="url(#shadow2)">
    <rect x="28" y="560" width="364" height="96" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <rect x="28" y="560" width="6" height="96" rx="3" fill="#10b981"/>

    <!-- FOTO DO PRODUTO (THUMBNAIL 48x48) -->
    <rect x="42" y="572" width="48" height="48" rx="10" fill="#fef9c3" stroke="#fef08a" stroke-width="1"/>
    <text x="66" y="603" font-size="26" text-anchor="middle">🍌</text>

    <text x="98" y="584" font-size="11" font-weight="800" fill="#047857">ERP 101</text>
    <rect x="294" y="572" width="88" height="18" rx="9" fill="#dcfce7"/>
    <text x="338" y="585" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">✓ 215.40 KG</text>

    <text x="98" y="601" font-size="14" font-weight="800" fill="#065f46">Banana Prata Especial</text>
    <text x="98" y="618" font-size="12" font-weight="600" fill="#475569">Pedido: 10 CX • <tspan fill="#166534" font-weight="700">Recebido: 215.40 KG</tspan></text>

    <text x="344" y="642" font-size="11" font-weight="700" fill="#006b4f">✏️ Alterar peso</text>
  </g>

  <!-- CARD 4: JÁ CONFERIDO NÃO RECEBIDO (MELANCIA) -->
  <g filter="url(#shadow2)">
    <rect x="28" y="664" width="364" height="88" rx="12" fill="#fff5f5" stroke="#fecaca" stroke-width="1"/>
    <rect x="28" y="664" width="6" height="88" rx="3" fill="#ef4444"/>

    <!-- FOTO DO PRODUTO (THUMBNAIL 48x48) -->
    <rect x="42" y="674" width="48" height="48" rx="10" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
    <text x="66" y="705" font-size="26" text-anchor="middle">🍉</text>

    <text x="98" y="686" font-size="11" font-weight="800" fill="#991b1b">ERP 204</text>
    <rect x="280" y="674" width="102" height="18" rx="9" fill="#fee2e2"/>
    <text x="331" y="687" font-size="10" font-weight="700" fill="#b91c1c" text-anchor="middle">✕ Não Recebido (0 KG)</text>

    <text x="98" y="704" font-size="14" font-weight="800" fill="#7f1d1d">Melancia Graúda</text>
    <text x="98" y="721" font-size="12" font-weight="500" fill="#64748b">Pedido: 15 UND • Confirmado corte/falta</text>
  </g>

  <!-- STICKY FOOTER DE AÇÕES DA CONFERÊNCIA -->
  <rect x="15" y="760" width="390" height="74" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Botão Salvar Parcial -->
  <rect x="28" y="772" width="144" height="48" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="100" y="801" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">💾 Salvar Parcial</text>

  <!-- Botão Finalizar Conferência (Desabilitado com contador de pendentes) -->
  <rect x="180" y="772" width="212" height="48" rx="10" fill="#94a3b8"/>
  <text x="286" y="792" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Finalizar Conferência</text>
  <text x="286" y="808" font-size="10" font-weight="600" fill="#e2e8f0" text-anchor="middle">Faltam 6 itens para pesar</text>

  <!-- Legenda externa de apresentação -->
  <text x="210" y="852" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">Fase 5 • Tela 02: Conferência Física com Fotos dos Produtos</text>
</svg>