<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 860" width="420" height="860" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#004737"/>
      <stop offset="100%" stop-color="#006b4f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Moldura do Celular -->
  <rect x="15" y="15" width="390" height="830" rx="42" fill="#f4f7f9" stroke="#334155" stroke-width="4"/>
  <rect x="145" y="22" width="130" height="26" rx="13" fill="#1e293b"/>

  <!-- Barra de Status Mobile -->
  <text x="42" y="40" font-size="13" font-weight="700" fill="#0f172a">09:41</text>
  <circle cx="340" cy="36" r="3" fill="#0f172a"/>
  <circle cx="348" cy="36" r="3" fill="#0f172a"/>
  <circle cx="356" cy="36" r="3" fill="#0f172a"/>
  <rect x="366" y="30" width="18" height="11" rx="3" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="368" y="32" width="12" height="7" rx="1.5" fill="#0f172a"/>

  <!-- Topbar Base -->
  <rect x="15" y="54" width="390" height="70" fill="url(#headerGrad)"/>
  <text x="32" y="86" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="-0.3">MULTISHOW</text>
  <text x="32" y="106" font-size="12" font-weight="500" fill="#a7f3d0">FLV • Ponta da Fruta</text>

  <!-- Botão Sair / Perfil -->
  <rect x="312" y="74" width="76" height="30" rx="8" fill="rgba(255,255,255,0.15)"/>
  <text x="350" y="93" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">Sair ↪</text>

  <!-- Conteúdo de fundo esmaecido (simulando a tela de trás) -->
  <rect x="30" y="140" width="360" height="80" rx="12" fill="#ffffff" opacity="0.6"/>
  <rect x="30" y="230" width="360" height="80" rx="12" fill="#ffffff" opacity="0.6"/>

  <!-- Backdrop Escurecido do Modal -->
  <rect x="15" y="54" width="390" height="791" rx="0" fill="rgba(15, 23, 42, 0.65)"/>

  <!-- Modal Central: Hub de Navegação da Loja -->
  <g filter="url(#shadow)">
    <rect x="32" y="170" width="356" height="520" rx="20" fill="#ffffff"/>

    <!-- Cabeçalho do Modal -->
    <rect x="32" y="170" width="356" height="68" rx="20" fill="#f8fafc"/>
    <path d="M 32 238 L 388 238" stroke="#e2e8f0" stroke-width="1"/>
    <text x="52" y="202" font-size="17" font-weight="800" fill="#0f172a">Acesso Operacional</text>
    <text x="52" y="222" font-size="12" font-weight="500" fill="#64748b">O que você deseja fazer agora?</text>

    <!-- Opção 1: Fazer Pedido -->
    <g filter="url(#cardShadow)">
      <rect x="48" y="254" width="324" height="106" rx="14" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
      <!-- Ícone Pedido -->
      <circle cx="82" cy="307" r="22" fill="#ecfdf5"/>
      <text x="82" y="314" font-size="22" text-anchor="middle">📝</text>

      <text x="116" y="286" font-size="16" font-weight="800" fill="#065f46">Fazer Pedido</text>
      <text x="116" y="306" font-size="12" font-weight="500" fill="#475569">Lançar estoque e pedidos para</text>
      <text x="116" y="322" font-size="12" font-weight="500" fill="#475569">o próximo ciclo de compras</text>

      <!-- Badge status -->
      <rect x="116" y="332" width="130" height="18" rx="9" fill="#d1fae5"/>
      <text x="181" y="344" font-size="10" font-weight="700" fill="#047857" text-anchor="middle">✓ Ciclo 28/10 Aberto</text>
      
      <!-- Seta -->
      <text x="350" y="312" font-size="18" font-weight="700" fill="#10b981">❯</text>
    </g>

    <!-- Opção 2: Conferência de Recebimento -->
    <g filter="url(#cardShadow)">
      <rect x="48" y="376" width="324" height="106" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
      <!-- Ícone Conferência -->
      <circle cx="82" cy="429" r="22" fill="#fffbeb"/>
      <text x="82" y="436" font-size="22" text-anchor="middle">⚖️</text>

      <text x="116" y="408" font-size="16" font-weight="800" fill="#92400e">Conferência de Entrega</text>
      <text x="116" y="428" font-size="12" font-weight="500" fill="#475569">Pesar e conferir mercadorias</text>
      <text x="116" y="444" font-size="12" font-weight="500" fill="#475569">chegando do caminhão (em KG)</text>

      <!-- Badge status -->
      <rect x="116" y="454" width="156" height="18" rx="9" fill="#fef3c7"/>
      <text x="194" y="466" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">⚠️ 1 Ciclo pendente de peso</text>

      <!-- Seta -->
      <text x="350" y="434" font-size="18" font-weight="700" fill="#f59e0b">❯</text>
    </g>

    <!-- Opção 3: Lançamento de Perdas -->
    <g filter="url(#cardShadow)">
      <rect x="48" y="498" width="324" height="106" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <!-- Ícone Perdas -->
      <circle cx="82" cy="551" r="22" fill="#eff6ff"/>
      <text x="82" y="558" font-size="22" text-anchor="middle">🗑️</text>

      <text x="116" y="530" font-size="16" font-weight="800" fill="#1e3a8a">Lançamento de Perdas</text>
      <text x="116" y="550" font-size="12" font-weight="500" fill="#475569">Registrar quebras e descartes</text>
      <text x="116" y="566" font-size="12" font-weight="500" fill="#475569">durante o expediente da loja</text>

      <!-- Badge status -->
      <rect x="116" y="576" width="118" height="18" rx="9" fill="#dbeafe"/>
      <text x="175" y="588" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">📊 3 registros hoje</text>

      <!-- Seta -->
      <text x="350" y="556" font-size="18" font-weight="700" fill="#94a3b8">❯</text>
    </g>

    <!-- Rodapé informativo -->
    <text x="210" y="640" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">Você pode alternar entre os módulos a qualquer</text>
    <text x="210" y="656" font-size="11" font-weight="500" fill="#64748b" text-anchor="middle">momento pelo menu superior sem refazer login.</text>
  </g>

  <!-- Legenda externa de apresentação -->
  <text x="210" y="820" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">Fase 5 • Tela 01: Hub de Navegação das Lojas</text>
</svg>